# ============================================
# Enterprise RAG Platform — Docker Compose
# ============================================
# Development environment with hot-reload.
#
# Services:
#   frontend  → Next.js (port 3000)
#   backend   → FastAPI (port 8000)
#   redis     → Redis   (port 6379)
#   worker    → Background worker (same image as backend)
#
# Managed services (NOT in Docker):
#   Supabase  → PostgreSQL + pgvector + Storage (cloud)
#   Clerk     → Authentication (cloud)
#   OpenRouter → LLM API (cloud, user BYOK)
#   LangSmith → Observability (cloud)

version: "3.8"

services:
  # ── Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/dashboard
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/dashboard
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent host node_modules from overriding
      - /app/.next          # Prevent host .next from overriding
    depends_on:
      - backend

  # ── Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - BACKEND_CORS_ORIGINS=http://localhost:3000
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_STORAGE_BUCKET=documents
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JINA_API_KEY=${JINA_API_KEY:-}
      - JINA_RERANKER_MODEL=${JINA_RERANKER_MODEL:-jina-reranker-v2-base-multilingual}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-supabase}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-${LANGSMITH_TRACING:-false}}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-${LANGSMITH_API_KEY:-}}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-${LANGSMITH_PROJECT:-ai-rag-platform-dev}}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-${LANGCHAIN_TRACING_V2:-false}}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-${LANGCHAIN_API_KEY:-}}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-${LANGCHAIN_PROJECT:-ai-rag-platform-dev}}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - ./backend:/app
      - ./evaluation:/app/evaluation
    depends_on:
      - redis
      - rabbitmq

  # ── Redis ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Health check so other services wait for Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ Message Broker ──────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rag_rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Web Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Background Worker ───────────────────────────
  # Same codebase as backend, running Celery worker + cleanup daemon.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.main
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_STORAGE_BUCKET=documents
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JINA_API_KEY=${JINA_API_KEY:-}
      - JINA_RERANKER_MODEL=${JINA_RERANKER_MODEL:-jina-reranker-v2-base-multilingual}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-supabase}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-${LANGSMITH_TRACING:-false}}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-${LANGSMITH_API_KEY:-}}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-${LANGSMITH_PROJECT:-ai-rag-platform-dev}}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-${LANGCHAIN_TRACING_V2:-false}}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-${LANGCHAIN_API_KEY:-}}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-${LANGCHAIN_PROJECT:-ai-rag-platform-dev}}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - ./backend:/app
      - ./evaluation:/app/evaluation
    depends_on:
      - redis
      - rabbitmq

volumes:
  redis_data:
  rabbitmq_data:
