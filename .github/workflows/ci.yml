name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (Linter & Format Check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy (Strict Type Check)
        run: |
          mypy app

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          LOG_LEVEL: INFO
          BACKEND_CORS_ORIGINS: http://localhost:3000
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          SUPABASE_URL: https://dummy-project.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJdummy_service_role_key_for_ci
          DATABASE_URL: postgresql://postgres:dummy@localhost:5432/postgres
          SUPABASE_STORAGE_BUCKET: documents
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v tests/

  frontend-ci:
    name: Frontend (Next.js 16 / Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Next.js Production Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_ci_build
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
        run: npm run build

  security-scan:
    name: Secret Leak & File Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          echo "Checking for accidental secret files..."
          if git ls-files | grep -E "(^\.env|\.env\.local|\.env\.production|id_rsa|\.pem)$"; then
            echo "ERROR: Tracked secret file detected!"
            exit 1
          fi
          echo "Secret check passed: No secret files tracked in Git."

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, security-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: enterprise-rag-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: enterprise-rag-frontend:ci-test
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_dummy_key_for_ci_build
          cache-from: type=gha
          cache-to: type=gha,mode=max
